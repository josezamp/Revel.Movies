services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-RevelMovies_dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./apps/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RevelMovies: Server=sqlserver,1433;Database=Revel.Movies;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RevelMovies_dev_2026!};TrustServerCertificate=True
      MediaStorage__RootPath: /app/media
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - media:/app/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  media:
