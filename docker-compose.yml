services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: revel_movies
      POSTGRES_USER: revel
      POSTGRES_PASSWORD: revel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revel -d revel_movies"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RevelMovies: Host=postgres;Port=5432;Database=revel_movies;Username=revel;Password=revel
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  media:
